<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>jQuery Square Animation</title>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>
      body {
        position: relative;
        height: 100vh;
        margin: 20px;
      }

      #box {
        width: 100px;
        height: 100px;
        background-color: steelblue;
        margin-top: 50px;
        position: absolute;
        top: 0;
        left: 0;
      }

      button {
        margin-bottom: 20px;
      }
    </style>
  </head>
  <body>
    <button id="startBtn">Start Animation</button>

    <div id="box"></div>

    <script>
      $(document).ready(function () {
        $("#startBtn").click(function () {
          $("#box")
            // Move Down
            .css("background-color", "tomato")
            .animate(
              {
                top: "400px",
              },
              1000,
            )

            // Move Right
            .queue(function (next) {
              $(this).css("background-color", "green");
              next();
            })
            .animate(
              {
                left: "500px",
              },
              1000,
            )

            // Move Up
            .queue(function (next) {
              $(this).css("background-color", "orange");
              next();
            })
            .animate(
              {
                top: "0px",
              },
              1000,
            )

            // Move Left
            .queue(function (next) {
              $(this).css("background-color", "purple");
              next();
            })
            .animate(
              {
                left: "0px",
              },
              1000,
            );
        });
      });
    </script>
  </body>
</html>
